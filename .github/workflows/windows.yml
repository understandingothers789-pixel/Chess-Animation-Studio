name: Windows portable build
run-name: Windows portable build — ${{ github.ref_name }} @ ${{ github.sha }}
on:
  push:
    branches: [fresh-start, architecture/effect-compositor]
    paths-ignore: ['**.md', '**.txt', 'docs/**']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a new immutable release after validation
        type: boolean
        required: false
        default: false
      require_signature:
        description: Require a verified Studio publisher signature
        type: boolean
        required: false
        default: false
permissions:
  contents: write
jobs:
  visual:
    uses: ./.github/workflows/visual.yml
  portable:
    needs: visual
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          if (-not (Test-Path "docs/releases/$v.md")) { throw 'Missing release notes' }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Install pinned dependencies
        run: npm ci
      - name: Install export validation tool
        shell: pwsh
        run: |
          # Keep the export validator pinned to the last verified release.
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $zip
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') { throw 'FFmpeg ZIP checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          $ffmpeg = Join-Path $destination 'ffmpeg-9.0.2-essentials_build/bin/ffmpeg.exe'
          $ffprobe = Join-Path $destination 'ffmpeg-9.0.2-essentials_build/bin/ffprobe.exe'
          $ffmpegVersion = & $ffmpeg -version | Select-Object -First 1
          if ($ffmpegVersion -notmatch '^ffmpeg version 9\.0\.2(?:[-\s]|$)') {
            throw "Expected FFmpeg 9.0.2, got: $ffmpegVersion"
          }
          Write-Host $ffmpegVersion
          "FFMPEG_PATH=$ffmpeg" >> $env:GITHUB_ENV
          "FFPROBE_PATH=$ffprobe" >> $env:GITHUB_ENV
      - name: Install pinned Stockfish for validation only
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-windows-x86-64-avx2.zip' -OutFile "$env:RUNNER_TEMP/stockfish.zip"
          $h = (Get-FileHash "$env:RUNNER_TEMP/stockfish.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne '92a77f8d8116b4331696eeb7b232bd03db30d6641a6ce1be1759478b8931d28b') { throw 'Stockfish checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/stockfish.zip" "$env:RUNNER_TEMP/stockfish-check"
          $exe = (Get-ChildItem "$env:RUNNER_TEMP/stockfish-check" -Recurse -Filter '*.exe' | Select-Object -First 1).FullName
          "STOCKFISH_PATH=$exe" >> $env:GITHUB_ENV
      - name: Build application
        run: npm run build
      - name: Run unit and service tests
        run: npm test
      - name: Build standard portable layout
        env:
          STUDIO_SIGNING_PFX_BASE64: ${{ secrets.STUDIO_SIGNING_PFX_BASE64 }}
          STUDIO_SIGNING_PFX_PASSWORD: ${{ secrets.STUDIO_SIGNING_PFX_PASSWORD }}
          STUDIO_REQUIRE_SIGNATURE: ${{ inputs.require_signature || false }}
        run: node scripts/portable.mjs
      - name: Record official runtime signature
        shell: pwsh
        run: |
          $p = "release/Chess-Animation-Studio-${{ steps.version.outputs.value }}-Windows-Portable/Chess Animation Studio.exe"
          $s = Get-AuthenticodeSignature -LiteralPath $p
          $s | Format-List Status,StatusMessage,SignerCertificate
          $s | Select-Object Status,StatusMessage,@{n='Signer';e={$_.SignerCertificate.Subject}} | ConvertTo-Json -Depth 3 | Set-Content 'release/runtime-signature-${{ steps.version.outputs.value }}.json' -Encoding utf8
          if ($s.Status -notin @('Valid', 'NotSigned')) { throw 'Runtime signature validation error' }
          $build = Get-Content "release/Chess-Animation-Studio-${{ steps.version.outputs.value }}-Windows-Portable/BUILD.json" | ConvertFrom-Json
          if ($build.appSigned -and $s.Status -ne 'Valid') { throw 'Studio publisher signature is invalid' }
          if ((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $build.packagedExecutableSha256) { throw 'Packaged executable checksum mismatch' }
      - name: Exercise packaged Windows app and exports
        shell: pwsh
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'Portable launch with spaces'
          Expand-Archive -LiteralPath 'release/Chess-Animation-Studio-${{ steps.version.outputs.value }}-Windows-x64.zip' -DestinationPath $fresh
          $env:STUDIO_PACKAGED_EXE = (Join-Path $fresh 'Chess Animation Studio.exe')
          $desktopLog = Join-Path $env:RUNNER_TEMP 'desktop-validation.log'
          $desktopStatus = 1
          try {
            npm run test:desktop 2>&1 | Tee-Object -FilePath $desktopLog
            $desktopStatus = $LASTEXITCODE
          } catch {
            $_ | Out-File -FilePath $desktopLog -Append
          }
          if ($desktopStatus -ne 0) {
            python .github/scripts/report-context-failure.py $desktopLog 'Packaged Windows validation output'
            exit $desktopStatus
          }
          npm run test:transcript:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload versioned Windows portable download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Animation-Studio-${{ steps.version.outputs.value }}-Windows-Portable
          path: |
            release/Chess-Animation-Studio-${{ steps.version.outputs.value }}-Windows-Portable/**
          if-no-files-found: error
          retention-days: 90
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-validation-${{ steps.version.outputs.value }}-${{ github.run_number }}
          path: |
            test-results/**
            release/runtime-signature-*.json
            release/*.sha256
          if-no-files-found: ignore
      - name: Publish immutable versioned release assets
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          git ls-remote --exit-code --tags origin "refs/tags/studio-v$v"
          if ($LASTEXITCODE -eq 0) { throw 'Version tag already exists; choose a new version explicitly.' }
          if ($LASTEXITCODE -ne 2) { throw 'Unable to verify release tag availability.' }
          $name = "Chess-Animation-Studio-$v-Windows-x64.zip"
          gh release create "studio-v$v" "release/$name" "release/$name.sha256" "release/runtime-signature-$v.json" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Chess Animation Studio $v for Windows (x64)" --notes-file "docs/releases/$v.md"
          if ($LASTEXITCODE -ne 0) {
            "## Release publication failed`nThe validated portable artifact remains available in this run." >> $env:GITHUB_STEP_SUMMARY
            throw 'Release upload failed; the validated workflow artifact remains available.'
          }
          $base = "https://github.com/${{ github.repository }}/releases/download/studio-v$v"
          $expected = (Get-FileHash -LiteralPath "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          $download = Join-Path $env:RUNNER_TEMP $name
          $publishedChecksum = Join-Path $env:RUNNER_TEMP "$name.sha256"
          curl.exe --fail --silent --show-error --location --retry 6 --retry-all-errors "$base/${name}?download=1" --output $download
          if ($LASTEXITCODE -ne 0) { throw 'Public ZIP download failed' }
          curl.exe --fail --silent --show-error --location --retry 6 --retry-all-errors "$base/$name.sha256" --output $publishedChecksum
          if ($LASTEXITCODE -ne 0) { throw 'Public checksum download failed' }
          $advertised = ((Get-Content -Raw $publishedChecksum).Trim() -split '\s+')[0]
          if ($advertised -ne $expected -or (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Public release checksum mismatch' }
          "## Release verified`n[Download Chess Animation Studio $v for Windows (x64)]($base/${name}?download=1)" >> $env:GITHUB_STEP_SUMMARY
