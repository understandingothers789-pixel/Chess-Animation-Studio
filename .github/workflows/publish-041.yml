name: Publish validated Studio 0.2.41
on:
  push:
    branches: [release/publish-041]
    paths: [.github/workflows/publish-041.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify validated source and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: 7d88fa0788cf5ba5d4286526f8412e87787980da
          RUN: '45245482759'
        run: |
          set -euo pipefail
          gh run watch "$RUN" --exit-status --interval 25
          gh api "repos/$GH_REPO/actions/runs/$RUN" > run.json
          jq -e --arg source "$SOURCE" '.head_sha == $source and .status == "completed" and .conclusion == "success"' run.json
          gh api "repos/$GH_REPO/actions/runs/$RUN/artifacts" > artifacts.json
          id=$(jq -er '.artifacts[] | select(.name == "Chess-Animation-Studio-0.2.41-Windows-Portable" and .expired == false) | .id' artifacts.json)
          digest=$(jq -er --argjson id "$id" '.artifacts[] | select(.id == $id) | .digest' artifacts.json)
          zip=Chess-Animation-Studio-0.2.41-Windows-x64.zip
          gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$zip"
          echo "${digest#sha256:}  $zip" | sha256sum --check
          unzip -p "$zip" BUILD.json | jq -e --arg source "$SOURCE" '.appVersion == "0.2.41" and .sourceCommit == $source and .buildArch == "x64" and .sourceDirty == false'
          sha256sum "$zip" > "$zip.sha256"
          evidence=$(jq -er '.artifacts[] | select(.name == "Chromium-visual-evidence") | .id' artifacts.json)
          gh api "repos/$GH_REPO/actions/artifacts/$evidence/zip" > evidence.zip
          unzip -p evidence.zip test-results/customization-render/piece-flip-beat-zoom.mp4 > 3d-piece-flip-demo.mp4
          gh release create studio-v0.2.41 "$zip" "$zip.sha256" 3d-piece-flip-demo.mp4 --target "$SOURCE" --latest --title "Chess Animation Studio 0.2.41 for Windows (x64)" --notes-file docs/releases/0.2.41.md
