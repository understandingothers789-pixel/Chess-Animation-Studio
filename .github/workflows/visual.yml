name: Chromium visual regression
on:
  workflow_call:
  pull_request:
    branches: [architecture/effect-compositor]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install video validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compare candidate against verified Phase II
        shell: bash
        run: |
          set -o pipefail
          context_log="$RUNNER_TEMP/context-validation.log"
          exec > >(tee "$context_log") 2>&1
          trap 'context_status=$?; python .github/scripts/report-context-failure.py "$context_log"; exit "$context_status"' ERR
          export CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from '@playwright/test'; console.log(chromium.executablePath())")
          git worktree add --detach "$RUNNER_TEMP/visual-reference" 9fcf3f54913ac1a27560a61e0db8e80abb998dd5
          (cd "$RUNNER_TEMP/visual-reference" && npm ci && npm run test:render -- reference)
          npm run test:timeline
          npm run test:storyboard
          npm run test:finishing
          npm run test:composition
          npm run test:ducking
          npm run test:render -- final
          golden_ref=$(cat docs/cinematic-goldens/source-ref)
          [[ "$golden_ref" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach "$RUNNER_TEMP/cinematic-reference" "$golden_ref"
          (cd "$RUNNER_TEMP/cinematic-reference" && npm ci && APPROVE_CINEMATIC_GOLDENS=phase4-reviewed node --import tsx scripts/cinematic-visual.ts)
          CINEMATIC_GOLDEN_DIR="$RUNNER_TEMP/cinematic-reference/test-results/phase4-candidate" node --import tsx scripts/cinematic-visual.ts
          node scripts/compare-render-hashes.mjs "$RUNNER_TEMP/visual-reference/test-results/render-reference/hashes.json" test-results/render-final/hashes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chromium-visual-evidence
          path: |
            test-results/storyboard-render/
            test-results/finishing-render/
            test-results/composition-render/
            docs/composition-033/
            test-results/ducking/
            docs/ducking-032/
            docs/finishing-031/*.png
            docs/finishing-031/performance.json
            docs/storyboard-030/*.png
            test-results/context-validation.log
            test-results/timeline-menus/
            test-results/render-final/
            test-results/phase4-candidate/
