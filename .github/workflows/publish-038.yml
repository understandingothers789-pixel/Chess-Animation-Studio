name: Publish validated Studio 0.2.38
on:
  push:
    branches: [release/publish-038]
    paths: [.github/workflows/publish-038.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify validated source and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: 6449646879c29a1b1457390823cded2cbea9365d
          RUN: '44761895449'
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN" > run.json
          jq -e --arg source "$SOURCE" '.head_sha == $source and .status == "completed" and .conclusion == "success"' run.json
          gh api "repos/$GH_REPO/actions/runs/$RUN/artifacts" > artifacts.json
          id=$(jq -er '.artifacts[] | select(.name == "Chess-Animation-Studio-0.2.38-Windows-Portable" and .expired == false) | .id' artifacts.json)
          digest=$(jq -er --argjson id "$id" '.artifacts[] | select(.id == $id) | .digest' artifacts.json)
          zip=Chess-Animation-Studio-0.2.38-Windows-x64.zip
          gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$zip"
          echo "${digest#sha256:}  $zip" | sha256sum --check
          unzip -p "$zip" BUILD.json | jq -e --arg source "$SOURCE" '.appVersion == "0.2.38" and .sourceCommit == $source and .buildArch == "x64" and .sourceDirty == false'
          sha256sum "$zip" > "$zip.sha256"
          evidence=$(jq -er '.artifacts[] | select(.name == "Chromium-visual-evidence") | .id' artifacts.json)
          gh api "repos/$GH_REPO/actions/artifacts/$evidence/zip" > evidence.zip
          unzip -p evidence.zip test-results/customization-render/piece-flip-beat-zoom.mp4 > piece-flip-beat-zoom.mp4
          gh release create studio-v0.2.38 "$zip" "$zip.sha256" piece-flip-beat-zoom.mp4 --verify-tag --latest --title "Chess Animation Studio 0.2.38 for Windows (x64)" --notes-file docs/releases/0.2.38.md
